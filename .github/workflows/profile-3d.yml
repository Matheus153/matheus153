name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@0.6.0
        env:
          # Para contar também contribuições privadas, crie um Personal Access Token
          # e salve como secret MY_GITHUB_TOKEN. Sem ele, usa o GITHUB_TOKEN padrão.
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          # Só faz commit se houver mudanças (evita falha com "nothing to commit")
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no SVG; nada para commitar."
          else
            git commit -m "Automated 3D profile update [skip ci]"
            git push
          fi
